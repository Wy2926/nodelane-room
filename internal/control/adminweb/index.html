<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NodeLane Room · 管理台</title><link rel="stylesheet" href="/admin/assets/style.css"><script src="/admin/assets/app.js" defer></script></head>
<body>
<div id="auth" class="auth-shell"><div class="auth-card"><div class="brand">N<span>NodeLane Room</span></div><p class="eyebrow">PRIVATE NETWORK / CONTROL</p><h1 id="auth-title">欢迎回来</h1><p class="muted" id="auth-copy">登录后管理节点、房间和网络授权。</p><form id="login-form"><label>管理员账号<input name="username" autocomplete="username" required maxlength="80"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><label id="bootstrap-field" hidden>初始化码<input name="code" type="password" autocomplete="off" maxlength="64"></label><button class="primary" type="submit" id="login-submit">登录管理台</button></form><button id="auth-switch" class="text-button" type="button">首次部署？初始化管理员</button><p id="auth-error" role="alert"></p><small>VERSION {{.Version}}</small></div></div>
<div id="app" hidden><aside><a class="brand" href="/admin">N<span>NodeLane Room</span></a><p class="eyebrow">控制台</p><nav id="nav" aria-label="主导航"><button data-tab="overview" class="selected">总览</button><button data-tab="nodes">节点</button><button data-tab="rooms">房间</button><button data-tab="system">系统</button><button data-tab="events">操作记录</button></nav><div class="sidebar-foot"><span id="connection">正在同步</span><small>V{{.Version}}</small><button id="logout" class="text-button">退出登录</button></div></aside><main><header><div><p class="eyebrow" id="breadcrumb">网络运行状态</p><h1 id="page-title">总览</h1></div><span id="clock" class="muted"></span></header><div id="message" role="status" aria-live="polite"></div><section id="content" aria-label="管理内容"></section></main></div>
<dialog id="modal"><div class="dialog-heading"><h2 id="modal-title"></h2><button id="modal-close" aria-label="关闭">×</button></div><div id="modal-message" role="alert"></div><div id="modal-body"></div></dialog>
</body></html>
