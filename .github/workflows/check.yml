name: verify
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version-file: '.nvmrc', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build
      - run: npm --prefix desktop test
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: python scripts/desktop/test_package.py
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/desktop/test-windows.ps1
      - if: runner.os == 'Windows'
        run: ./scripts/desktop/test-uninstall.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/desktop/test-setup.ps1
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/desktop/test-tap.ps1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.8'}
      - run: go mod verify
      - uses: actions/setup-node@v4
        with: {node-version-file: '.nvmrc', cache: npm, cache-dependency-path: internal/control/adminweb/package-lock.json}
      - run: npm --prefix internal/control/adminweb ci
      - run: npm --prefix internal/control/adminweb run build
      - run: npm --prefix internal/control/adminweb test
      - run: go vet ./...
      - run: go test -count=1 ./...
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: nodelane_test}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-retries 20
    env:
      NODELANE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/nodelane_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.8'}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.nvmrc', cache: npm, cache-dependency-path: internal/control/adminweb/package-lock.json}
      - run: npm --prefix internal/control/adminweb ci
      - run: npm --prefix internal/control/adminweb run build
      - run: npm --prefix internal/control/adminweb test
      - run: go vet ./...
      - run: go test -count=1 ./...
      # Keep real Nebula integration tests in this blocking check when
      # updating the pinned fork.
      - run: go test -race -count=1 ./...
