# 已有 PostgreSQL 与 HTTPS 反代。管理入口由本机 admin path 命令查询。
# 同机另起实例用 docker compose -p <实例名>；各实例有独立私有卷，可接入同一数据库。
name: nodelane-room
services:
  control:
    image: docker.nodelane.net/nodelane-room-control:${NODELANE_CONTROL_VERSION:-0.2.2}
    command: [serve, --listen, '0.0.0.0:8080', --behind-proxy]
    environment:
      NODELANE_ADMIN_PATH: ${NODELANE_ADMIN_PATH:-}
      NODELANE_GEOIP_URL: ${NODELANE_GEOIP_URL:-}
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['${CONTROL_BIND_IP:-127.0.0.1}:${CONTROL_PORT:-18080}:8080']
    volumes: [control-state:/var/lib/nodelane-control]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 20s
volumes:
  control-state: {}
# 接入已有 Docker 网络时叠加 compose.network.yaml。
# 反代在同一网络可直连 control:8080，并删除 ports；宿主反代可用默认 127.0.0.1:18080。
