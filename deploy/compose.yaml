# 全套自建部署：同目录放 .env 和 Caddyfile；默认直接拉取已发布镜像。
# 已有 PostgreSQL/反向代理时，独立使用 compose.host.yaml 和 .env.host.example。
# 同一部署固定项目名；改名会切换数据库与 TLS 证书卷。
name: ${CONTROL_PROJECT_NAME:-nodelane-room}
x-control: &control
  # 仓库不带 https://；两个副本和迁移任务使用同一版本。
  image: ${NODELANE_REGISTRY:-docker.nodelane.net}/nodelane-room-control:${NODELANE_VERSION:-0.2.0}
  # 地址池由 .env 配置，其余监听、代理和 CA 路径是容器内部固定值。
  command: [serve, --network, '${NODELANE_NETWORK:-10.203.0.0/16}', --listen, '0.0.0.0:8080', --behind-proxy, --ca-cert, /run/nodelane/ca.crt, --ca-key, /run/nodelane/ca.key]
  environment:
    PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL to the public HTTPS origin}
    # 密码须使用 URL 安全字符；数据库只允许内部 backend 网络访问。
    DATABASE_URL: postgres://nodelane:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/nodelane?sslmode=disable
  volumes:
    # 宿主 CA 目录默认 ./secrets，私钥只挂载到控制服务。
    - ${CA_DIR:-./secrets}:/run/nodelane:ro
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  # 控制容器不需要网络管理能力，也不能写入根文件系统。
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  stop_grace_period: 20s
  networks: [backend]

services:
  db:
    # 已验证的 PostgreSQL 版本；不要直接修改主版本来升级旧数据目录。
    image: postgres:18.6
    environment:
      POSTGRES_USER: nodelane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nodelane
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      # 先等数据库可连接，再允许运行迁移。
      test: [CMD-SHELL, 'pg_isready -U nodelane -d nodelane']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  migrate:
    # 一次性任务：Exited (0) 正常；失败时两个控制副本不会启动。
    <<: *control
    command: [migrate, --network, '${NODELANE_NETWORK:-10.203.0.0/16}']
    volumes: []
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      disable: true
  control-a: *control
  control-b: *control
  ca-init:
    # 仅显式执行 run ca-init；默认 up 不运行，也不覆盖已有 CA。
    <<: *control
    profiles: [setup]
    user: '${CA_INIT_UID:-1000}:${CA_INIT_GID:-1000}'
    command: [ca, init, --dir, /out, --network, '${NODELANE_NETWORK:-10.203.0.0/16}']
    volumes: ['${CA_DIR:-./secrets}:/out']
    depends_on: {}
    restart: 'no'
    healthcheck: {disable: true}

  edge:
    # Caddy 自动申请 HTTPS 证书；ROOM_DOMAIN 的 DNS 必须指向部署主机。
    image: caddy:2
    environment:
      ROOM_DOMAIN: ${ROOM_DOMAIN:?set ROOM_DOMAIN}
    # 宿主端口可通过 .env 修改；直接公网部署保留 80/443。
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on:
      control-a: {condition: service_healthy}
      control-b: {condition: service_healthy}
    restart: unless-stopped
    networks: [backend, edge]

networks:
  # 数据库和控制 API 无公网端口；只有 Caddy 加入可出站的 edge 网络。
  backend:
    internal: true
  edge: {}
volumes:
  # 持久化数据库、ACME 证书和 Caddy 配置；升级不得 down -v。
  postgres: {}
  caddy-data: {}
  caddy-config: {}
