# 全套自建：单控制实例、PostgreSQL 和 Caddy。管理入口由本机 admin path 命令查询。
name: nodelane-room
services:
  control:
    image: docker.nodelane.net/nodelane-room-control:${NODELANE_VERSION:-0.2.0}
    command: [serve, --listen, '0.0.0.0:8080', --behind-proxy]
    environment:
      NODELANE_ADMIN_PATH: ${NODELANE_ADMIN_PATH:-}
      NODELANE_GEOIP_URL: ${NODELANE_GEOIP_URL:-}
    volumes: [control-state:/var/lib/nodelane-control]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 20s
    networks: [backend, outbound]
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: nodelane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nodelane
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nodelane -d nodelane']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]
  edge:
    image: caddy:2
    environment:
      ROOM_DOMAIN: ${ROOM_DOMAIN:?set ROOM_DOMAIN}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on:
      control: {condition: service_healthy}
    restart: unless-stopped
    networks: [backend, edge]
networks:
  backend: {internal: true}
  edge: {}
  outbound: {}
volumes:
  postgres: {}
  control-state: {}
  caddy-data: {}
  caddy-config: {}
