components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: 'JSON error; 429 includes Retry-After: 60'
    schemas:
        AdminEvent:
            properties:
                actor:
                    type: string
                created_at:
                    format: date-time
                    type: string
                detail:
                    additionalProperties: true
                    type: object
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                target:
                    type: string
            required:
                - id
                - actor
                - kind
                - target
                - detail
                - created_at
            type: object
        AdminRoomSnapshot:
            properties:
                game:
                    $ref: '#/components/schemas/Game'
                members:
                    items:
                        $ref: '#/components/schemas/Member'
                    type: array
                room:
                    $ref: '#/components/schemas/Room'
                server_time:
                    format: date-time
                    type: string
            required:
                - room
                - game
                - members
                - server_time
            type: object
        AdminSnapshot:
            properties:
                ca_expires_at:
                    format: date-time
                    type: string
                deployment_id:
                    type: string
                events:
                    items:
                        $ref: '#/components/schemas/AdminEvent'
                    type: array
                games:
                    items:
                        $ref: '#/components/schemas/Game'
                    type: array
                network:
                    type: string
                nodes:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
                operations:
                    items:
                        $ref: '#/components/schemas/NodeOperation'
                    type: array
                public_url:
                    type: string
                registry:
                    type: string
                revision:
                    format: int64
                    type: integer
                rooms:
                    items:
                        $ref: '#/components/schemas/Room'
                    type: array
                server_time:
                    format: date-time
                    type: string
                version:
                    type: string
            required:
                - public_url
                - registry
                - revision
                - server_time
                - version
                - network
                - deployment_id
                - ca_expires_at
                - nodes
                - rooms
                - games
                - operations
                - events
            type: object
        Challenge:
            additionalProperties: false
            properties:
                id:
                    type: string
                nonce:
                    description: Standard base64
                    format: byte
                    type: string
            required:
                - id
                - nonce
            type: object
        ChallengeRequest:
            additionalProperties: false
            properties:
                device_id:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                name:
                    maxLength: 80
                    type: string
                public_key:
                    description: Standard base64
                    format: byte
                    type: string
            required:
                - device_id
                - name
                - public_key
            type: object
        Empty:
            additionalProperties: false
            properties: {}
            required: []
            type: object
        EnrollmentChallengeRequest:
            additionalProperties: false
            properties:
                device_id:
                    type: string
                key:
                    type: string
                name:
                    type: string
                public_key:
                    format: byte
                    type: string
            required:
                - key
                - device_id
                - name
                - public_key
            type: object
        Error:
            additionalProperties: false
            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message
            type: object
        Game:
            properties:
                background_url:
                    type: string
                cover_url:
                    type: string
                enabled:
                    type: boolean
                id:
                    type: string
                name:
                    type: string
                network:
                    $ref: '#/components/schemas/GameNetwork'
                ports:
                    items:
                        $ref: '#/components/schemas/GamePort'
                    type: array
                revision:
                    format: int64
                    type: integer
                source_url:
                    type: string
                summary:
                    type: string
            required:
                - id
                - name
                - summary
                - source_url
                - cover_url
                - background_url
                - ports
                - network
                - enabled
                - revision
            type: object
        GameImportRequest:
            properties:
                url:
                    type: string
            required:
                - url
            type: object
        GameNetwork:
            properties:
                broadcast:
                    type: boolean
                ethernet_types:
                    items:
                        format: int64
                        type: integer
                    type: array
                multicast:
                    type: boolean
                version:
                    format: int64
                    type: integer
            required:
                - version
                - broadcast
                - multicast
                - ethernet_types
            type: object
        GamePort:
            properties:
                description:
                    type: string
                port:
                    format: int64
                    type: integer
                port_end:
                    format: int64
                    type: integer
                protocol:
                    type: string
            required:
                - protocol
                - port
            type: object
        GameUpdateRequest:
            properties:
                enabled:
                    type: boolean
                name:
                    type: string
                network:
                    $ref: '#/components/schemas/GameNetwork'
                ports:
                    items:
                        $ref: '#/components/schemas/GamePort'
                    type: array
                revision:
                    format: int64
                    type: integer
            required:
                - name
                - ports
                - network
                - enabled
                - revision
            type: object
        HeartbeatRequest:
            properties:
                lan_version:
                    format: int64
                    type: integer
                mac:
                    type: string
            required:
                - lan_version
            type: object
        Invitation:
            additionalProperties: false
            properties:
                code:
                    type: string
                expires_at:
                    format: date-time
                    type: string
            required:
                - code
                - expires_at
            type: object
        JoinRequest:
            additionalProperties: false
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        LANStatus:
            properties:
                interface:
                    type: string
                ipv6:
                    type: string
                mac:
                    type: string
                mtu:
                    format: int64
                    type: integer
                ready:
                    type: boolean
                version:
                    format: int64
                    type: integer
            required:
                - version
                - interface
                - mac
                - ipv6
                - mtu
                - ready
            type: object
        Lease:
            properties:
                ca:
                    type: string
                certificate:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                fingerprint:
                    type: string
                ip:
                    type: string
                network:
                    type: string
                node:
                    $ref: '#/components/schemas/Node'
                room_id:
                    type: string
            required:
                - ip
                - network
                - ca
                - certificate
                - fingerprint
                - expires_at
            type: object
        LeaseRequest:
            properties:
                public_key:
                    format: byte
                    type: string
                revision:
                    format: int64
                    type: integer
            required:
                - public_key
            type: object
        LinkSample:
            properties:
                country:
                    type: string
                device_id:
                    type: string
                ip:
                    type: string
                loss_percent:
                    format: double
                    type: number
                mode:
                    type: string
                probe_at:
                    format: date-time
                    type: string
                region:
                    type: string
                relay_ips:
                    items:
                        type: string
                    type: array
                remote:
                    type: string
                rtt_ms:
                    format: double
                    type: number
            required:
                - device_id
                - ip
                - mode
                - relay_ips
                - probe_at
            type: object
        LoginAttempt:
            properties:
                expires_at:
                    format: date-time
                    type: string
                id:
                    type: string
                url:
                    type: string
            required:
                - id
                - url
                - expires_at
            type: object
        LoginClaim:
            description: proof is the original private proof; sign UTF8(nodelane-login-claim:<id>:<proof>). A successful claim is consumed once. Never log proof or returned sessions.
            properties:
                id:
                    type: string
                proof:
                    type: string
                signature:
                    format: byte
                    type: string
            required:
                - id
                - proof
                - signature
            type: object
        LoginResult:
            properties:
                session:
                    $ref: '#/components/schemas/Session'
                state:
                    type: string
            required:
                - state
            type: object
        LoginStart:
            description: proof is SHA256 of a 64-hex-character random private proof. Sign UTF8(nodelane-login-start:<device_id>:<proof_hash>) with the device Ed25519 key. Only a valid device signature can start enrollment.
            properties:
                device_id:
                    type: string
                name:
                    type: string
                proof:
                    type: string
                public_key:
                    format: byte
                    type: string
                signature:
                    format: byte
                    type: string
            required:
                - signature
                - device_id
                - public_key
                - name
                - proof
            type: object
        Member:
            properties:
                device_id:
                    type: string
                ip:
                    type: string
                last_seen:
                    format: date-time
                    type: string
                mac:
                    type: string
                name:
                    type: string
                user_id:
                    type: string
            required:
                - user_id
                - device_id
                - name
                - ip
                - last_seen
            type: object
        MemberRequest:
            additionalProperties: false
            properties:
                device_id:
                    type: string
            required:
                - device_id
            type: object
        NetworkSample:
            properties:
                at:
                    format: date-time
                    type: string
                connections:
                    format: int64
                    type: integer
                epoch:
                    type: string
                generation:
                    format: int64
                    type: integer
                peers:
                    items:
                        $ref: '#/components/schemas/LinkSample'
                    type: array
                traffic:
                    $ref: '#/components/schemas/TrafficSample'
            required:
                - epoch
                - at
                - generation
                - connections
                - peers
            type: object
        Node:
            properties:
                address:
                    type: string
                device_id:
                    type: string
                draining:
                    type: boolean
                generation:
                    format: int64
                    type: integer
                id:
                    type: string
                ip:
                    type: string
                last_seen:
                    format: date-time
                    type: string
                lighthouse:
                    type: boolean
                name:
                    type: string
                notes:
                    type: string
                region:
                    type: string
                relay:
                    type: boolean
                report:
                    $ref: '#/components/schemas/NodeReport'
                revision:
                    format: int64
                    type: integer
                state:
                    type: string
            required:
                - id
                - device_id
                - generation
                - revision
                - state
                - notes
                - report
                - name
                - region
                - ip
                - address
                - lighthouse
                - relay
                - draining
                - last_seen
            type: object
        NodeConfig:
            additionalProperties: false
            properties:
                address:
                    type: string
                lighthouse:
                    type: boolean
                name:
                    type: string
                notes:
                    type: string
                region:
                    type: string
                relay:
                    type: boolean
            required:
                - name
                - region
                - address
                - lighthouse
                - relay
                - notes
            type: object
        NodeOperation:
            properties:
                action:
                    type: string
                created_at:
                    format: date-time
                    type: string
                error:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                generation:
                    format: int64
                    type: integer
                id:
                    type: string
                node_id:
                    type: string
                revision:
                    format: int64
                    type: integer
                state:
                    type: string
            required:
                - id
                - node_id
                - generation
                - revision
                - action
                - state
                - created_at
                - expires_at
            type: object
        NodeProbe:
            properties:
                address:
                    type: string
                at:
                    format: date-time
                    type: string
                device_id:
                    type: string
                loss_percent:
                    format: double
                    type: number
                mode:
                    type: string
                remote:
                    type: string
                rtt_ms:
                    format: double
                    type: number
            required:
                - device_id
                - address
                - mode
                - at
            type: object
        NodeReport:
            properties:
                applied_config:
                    $ref: '#/components/schemas/NodeConfig'
                applied_revision:
                    format: int64
                    type: integer
                engine:
                    type: string
                error:
                    type: string
                last_renewal:
                    format: date-time
                    type: string
                lease_expires_at:
                    format: date-time
                    type: string
                probes:
                    items:
                        $ref: '#/components/schemas/NodeProbe'
                    type: array
                version:
                    type: string
            required:
                - version
                - engine
                - applied_revision
                - lease_expires_at
                - last_renewal
                - probes
            type: object
        NodeSync:
            properties:
                node:
                    $ref: '#/components/schemas/Node'
                operations:
                    items:
                        $ref: '#/components/schemas/NodeOperation'
                    type: array
                snapshot:
                    $ref: '#/components/schemas/Snapshot'
            required:
                - node
                - snapshot
                - operations
            type: object
        NodeSyncRequest:
            additionalProperties: false
            properties:
                generation:
                    format: int64
                    type: integer
                report:
                    $ref: '#/components/schemas/NodeReport'
                results:
                    items:
                        $ref: '#/components/schemas/OperationResult'
                    type: array
            required:
                - generation
                - report
                - results
            type: object
        OIDCSettings:
            properties:
                client_id:
                    type: string
                client_secret:
                    type: string
                    writeOnly: true
                enabled:
                    type: boolean
                issuer:
                    type: string
            required:
                - issuer
                - client_id
                - enabled
            type: object
        OK:
            additionalProperties: false
            properties:
                ok:
                    type: boolean
            required:
                - ok
            type: object
        OperationResult:
            properties:
                error:
                    type: string
                id:
                    type: string
                state:
                    type: string
            required:
                - id
                - state
            type: object
        Peer:
            properties:
                device_id:
                    type: string
                error:
                    type: string
                ip:
                    type: string
                loss_percent:
                    format: double
                    type: number
                mode:
                    type: string
                name:
                    type: string
                rtt_ms:
                    format: double
                    type: number
            required:
                - device_id
                - name
                - ip
                - mode
            type: object
        Room:
            properties:
                capacity:
                    default: 4
                    format: int64
                    type: integer
                closed:
                    type: boolean
                expires_at:
                    format: date-time
                    type: string
                game:
                    type: string
                game_name:
                    type: string
                id:
                    type: string
                name:
                    type: string
                owner_user_id:
                    type: string
                revision:
                    format: int64
                    type: integer
            required:
                - id
                - name
                - owner_user_id
                - game
                - game_name
                - revision
                - capacity
                - expires_at
                - closed
            type: object
        RoomManagement:
            properties:
                game:
                    $ref: '#/components/schemas/Game'
                members:
                    items:
                        $ref: '#/components/schemas/Member'
                    type: array
                room:
                    $ref: '#/components/schemas/Room'
                server_time:
                    format: date-time
                    type: string
            required:
                - room
                - game
                - members
                - server_time
            type: object
        RoomRequest:
            properties:
                game:
                    description: Enabled game ID from GET /v2/games, or custom; no game-specific discovery.
                    type: string
                name:
                    type: string
            required:
                - name
                - game
            type: object
        RoomResult:
            additionalProperties: false
            properties:
                invitation:
                    $ref: '#/components/schemas/Invitation'
                room:
                    $ref: '#/components/schemas/Room'
            required:
                - room
            type: object
        Session:
            properties:
                device_id:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                token:
                    type: string
                user:
                    $ref: '#/components/schemas/User'
            required:
                - token
                - expires_at
                - device_id
            type: object
        Snapshot:
            properties:
                blocklist:
                    items:
                        type: string
                    type: array
                game:
                    $ref: '#/components/schemas/Game'
                members:
                    items:
                        $ref: '#/components/schemas/Member'
                    type: array
                nodes:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
                room:
                    $ref: '#/components/schemas/Room'
                server_time:
                    format: date-time
                    type: string
            required:
                - members
                - nodes
                - blocklist
                - server_time
            type: object
        Status:
            properties:
                control:
                    type: string
                device_id:
                    type: string
                engine:
                    type: string
                error:
                    type: string
                game:
                    $ref: '#/components/schemas/Game'
                ip:
                    type: string
                lan:
                    $ref: '#/components/schemas/LANStatus'
                lan_version:
                    format: int64
                    type: integer
                lease_expires_at:
                    format: date-time
                    type: string
                members:
                    items:
                        $ref: '#/components/schemas/Member'
                    type: array
                name:
                    type: string
                peers:
                    items:
                        $ref: '#/components/schemas/Peer'
                    type: array
                protocol_version:
                    format: int64
                    type: integer
                room:
                    $ref: '#/components/schemas/Room'
                selected_room:
                    type: string
                server:
                    type: string
                snapshot_at:
                    format: date-time
                    type: string
                user:
                    $ref: '#/components/schemas/User'
                version:
                    type: string
            required:
                - lan_version
                - version
                - protocol_version
                - server
                - name
                - selected_room
                - members
                - snapshot_at
                - device_id
                - control
                - engine
                - peers
            type: object
        TelemetrySeries:
            properties:
                device_id:
                    type: string
                node_id:
                    type: string
                room_id:
                    type: string
                samples:
                    items:
                        $ref: '#/components/schemas/NetworkSample'
                    type: array
            required:
                - device_id
                - samples
            type: object
        TelemetrySnapshot:
            properties:
                geoip:
                    type: boolean
                geoip_provider:
                    type: string
                retention_seconds:
                    format: int64
                    type: integer
                series:
                    items:
                        $ref: '#/components/schemas/TelemetrySeries'
                    type: array
                server_time:
                    format: date-time
                    type: string
                stale_seconds:
                    format: int64
                    type: integer
            required:
                - server_time
                - retention_seconds
                - stale_seconds
                - geoip
                - series
            type: object
        TrafficSample:
            properties:
                download_bytes:
                    format: int64
                    type: integer
                scope:
                    type: string
                upload_bytes:
                    format: int64
                    type: integer
            required:
                - upload_bytes
                - download_bytes
                - scope
            type: object
        User:
            properties:
                created_at:
                    format: date-time
                    type: string
                id:
                    type: string
                kind:
                    type: string
                name:
                    type: string
                state:
                    type: string
            required:
                - id
                - name
                - kind
                - state
                - created_at
            type: object
        UserAction:
            properties:
                action:
                    type: string
                device_id:
                    type: string
                reason:
                    type: string
            required:
                - action
                - reason
            type: object
        UserDetail:
            properties:
                devices:
                    items:
                        $ref: '#/components/schemas/UserDevice'
                    type: array
                rooms:
                    items:
                        $ref: '#/components/schemas/Room'
                    type: array
                sessions:
                    items:
                        $ref: '#/components/schemas/UserSession'
                    type: array
                user:
                    $ref: '#/components/schemas/User'
            required:
                - user
                - devices
                - rooms
                - sessions
            type: object
        UserDevice:
            properties:
                device_id:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                last_seen:
                    format: date-time
                    type: string
                name:
                    type: string
                revoked:
                    type: boolean
            required:
                - device_id
                - name
                - revoked
                - last_seen
            type: object
        UserPage:
            properties:
                next:
                    type: string
                users:
                    items:
                        $ref: '#/components/schemas/User'
                    type: array
            required:
                - users
                - next
            type: object
        UserSession:
            properties:
                device_id:
                    type: string
                expires_at:
                    format: date-time
                    type: string
            required:
                - device_id
                - expires_at
            type: object
        VerifyRequest:
            additionalProperties: false
            properties:
                id:
                    type: string
                signature:
                    description: Standard base64
                    format: byte
                    type: string
            required:
                - id
                - signature
            type: object
    securitySchemes:
        AdminCookie:
            description: 12 hour random session; 30 minute idle timeout. Secure, HttpOnly, SameSite=Strict. All admin writes also require exact Origin and X-CSRF-Token.
            in: cookie
            name: __Host-nlroom-admin
            type: apiKey
        Bearer:
            description: One-hour device session from challenge verification
            scheme: bearer
            type: http
        NodeBearer:
            description: One-hour session scoped to the current nonrevoked node identity binding. Cannot authorize player/admin APIs.
            scheme: bearer
            type: http
info:
    description: 'Fresh database schema version 5 and identities required; API remains /v2. No old data migration. Device Ed25519 proofs sign UTF-8 nodelane-auth-v2:<scope>:<challenge-id>: followed by raw challenge nonce; scope is guest, player, node, or enrollment. Device identity and Nebula X25519 keys are separate. Byte fields use standard base64. Temporary enrollment keys contain 32 random bytes encoded as 64 hex characters, expire after 30 minutes and are consumed transactionally once. Never log credentials.'
    title: NodeLane Room V2
    version: 0.2.2
openapi: 3.0.3
paths:
    /healthz:
        get:
            operationId: health
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
                "503":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
            security: []
            summary: Process liveness
            tags:
                - Operations
    /install/{file}:
        get:
            parameters:
                - in: path
                  name: file
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        '*/*':
                            schema:
                                format: binary
                                type: string
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                        text/*:
                            schema:
                                type: string
                    description: Raw file bytes; Content-Type depends on the selected file. manifest.json is a JSON object, scripts/checksums are text, and archives are gzip data.
                "404":
                    description: Unknown or unavailable release file
            security: []
            summary: Read-only node.sh, manifest.json, SHA256SUMS or exact-version native archive
            tags:
                - Operations
    /metrics:
        get:
            operationId: metrics
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: Counters and gauges
            security: []
            summary: Prometheus metrics; restrict to monitoring network
            tags:
                - Operations
    /readyz:
        get:
            operationId: ready
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
                "503":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
            security: []
            summary: Database and CA readiness
            tags:
                - Operations
    /v2/admin/events:
        get:
