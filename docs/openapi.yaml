x-local-api:
    images:
        description: Public JPEG/PNG fetched only from the configured control origin, without session or redirects; at most two concurrent downloads; never part of status.
        kind:
            - cover
            - background
        max_response_bytes: 5242880
        method: GET
        path: /game-images/{game}/{kind}
    protocol_version: 2
    rpc:
        error:
            additionalProperties: false
            properties:
                code:
                    type: string
                error:
                    type: string
            required:
                - code
                - error
            type: object
        max_request_bytes: 65536
        max_response_bytes: 4194304
        method: POST
        path: /rpc
        request:
            additionalProperties: false
            properties:
                action:
                    enum:
                        - init
                        - account-login
                        - account-link
                        - account-poll
                        - account-cancel
                        - account-logout
                        - account-takeover
                        - status
                        - games
                        - rooms
                        - manage
                        - members
                        - create
                        - join
                        - invite
                        - kick
                        - transfer
                        - leave
                        - close
                        - ping
                        - doctor
                    type: string
                body:
                    type: object
                name:
                    type: string
                room:
                    type: string
                server:
                    type: string
                target:
                    type: string
            required:
                - action
            type: object
        responses:
            games:
                items:
                    $ref: '#/components/schemas/Game'
                type: array
            manage:
                $ref: '#/components/schemas/RoomManagement'
            members:
                $ref: '#/components/schemas/Snapshot'
            rooms:
                items:
                    $ref: '#/components/schemas/Room'
                type: array
            status:
                $ref: '#/components/schemas/Status'
    transport: HTTP over owner-authorized Named Pipe (Windows) or Unix socket (Linux); not served on the public control listener
