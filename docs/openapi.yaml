                        - local_service_unavailable
                        - local_state_inconsistent
                        - local_state_stale
                        - local_storage_failed
                        - local_stream_disconnected
                        - local_tap_invalid
                        - local_tap_missing
                        - local_tap_unavailable
                        - local_tls_failed
                        - local_udp_bind_failed
                        - local_unconfigured
                        - local_update_check_failed
                        - local_update_disk_full
                        - local_update_downgrade_rejected
                        - local_update_download_failed
                        - local_update_elevation_cancelled
                        - local_update_health_failed
                        - local_update_install_busy
