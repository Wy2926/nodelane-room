components:
    responses:
        Error:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Result'
            description: Structured interaction-1 result; code determines recovery, never message or HTTP class alone.
    schemas:
        AccountStatus:
            properties:
                device:
                    $ref: '#/components/schemas/UserDevice'
                membership:
                    $ref: '#/components/schemas/MembershipSelf'
                occupancy:
                    $ref: '#/components/schemas/MembershipSelf'
                room_creation:
                    $ref: '#/components/schemas/RoomCreationPermission'
                user:
                    $ref: '#/components/schemas/User'
            required:
                - room_creation
                - user
                - device
                - membership
            type: object
        AdminEvent:
            properties:
                actor:
                    type: string
                created_at:
                    format: date-time
                    type: string
                detail:
                    additionalProperties: true
                    type: object
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                target:
                    type: string
            required:
                - id
                - actor
                - kind
                - target
                - detail
                - created_at
            type: object
        AdminRoomSnapshot:
            properties:
                game:
                    $ref: '#/components/schemas/Game'
                members:
                    items:
                        $ref: '#/components/schemas/Member'
                    type: array
                room:
                    $ref: '#/components/schemas/Room'
                server_time:
                    format: date-time
                    type: string
            required:
                - room
                - game
                - members
                - server_time
            type: object
        AdminSnapshot:
            properties:
                ca_expires_at:
                    format: date-time
                    type: string
                deployment_id:
                    type: string
                events:
                    items:
                        $ref: '#/components/schemas/AdminEvent'
                    type: array
                games:
                    items:
                        $ref: '#/components/schemas/Game'
                    type: array
                network:
                    type: string
                nodes:
                    items:
                        $ref: '#/components/schemas/Node'
                    type: array
                operations:
                    items:
                        $ref: '#/components/schemas/NodeOperation'
                    type: array
                public_url:
                    type: string
                registry:
                    type: string
                revision:
                    format: int64
                    type: integer
                rooms:
                    items:
                        $ref: '#/components/schemas/Room'
                    type: array
                server_time:
                    format: date-time
                    type: string
                truncated:
                    additionalProperties:
                        type: boolean
                    type: object
                version:
                    type: string
            required:
                - truncated
                - public_url
                - registry
                - revision
                - server_time
                - version
                - network
                - deployment_id
                - ca_expires_at
                - nodes
                - rooms
                - games
                - operations
                - events
            type: object
        Challenge:
            additionalProperties: false
            properties:
                id:
                    type: string
                nonce:
                    description: Standard base64
                    format: byte
                    type: string
            required:
                - id
                - nonce
            type: object
        ChallengeRequest:
            additionalProperties: false
            properties:
                device_id:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                name:
                    maxLength: 80
                    type: string
                public_key:
                    description: Standard base64
                    format: byte
                    type: string
            required:
                - device_id
                - name
                - public_key
            type: object
        ClientReport:
            properties:
                arch:
                    type: string
                error_code:
                    type: string
                gui_version:
                    type: string
                os:
                    type: string
                release_id:
                    type: string
                state:
                    type: string
                version:
                    type: string
            required:
                - version
                - os
                - arch
                - state
            type: object
        Details:
            additionalProperties: false
            description: 'Per-code allowlist: validation fields/rules; stale expected/actual revision; occupancy room/device/revision; room_full capacity/member_count; request_too_large allowed_bytes; public expiry expires_at. known_commit only when a prior write was confirmed. Never request data, credentials or raw exceptions.'
            properties:
                actual_revision:
                    format: int64
                    type: integer
                allowed_bytes:
                    format: int64
                    type: integer
                capacity:
                    format: int64
                    type: integer
                device_id:
                    type: string
                expected_revision:
                    format: int64
                    type: integer
                expires_at:
                    format: date-time
                    type: string
                fields:
                    items:
                        $ref: '#/components/schemas/FieldIssue'
                    type: array
                known_commit:
                    type: boolean
                member_count:
                    format: int64
                    type: integer
                room_id:
                    type: string
            required: []
            type: object
        DeviceSoftware:
            properties:
                arch:
                    type: string
                error_code:
                    type: string
                gui_version:
                    type: string
                os:
                    type: string
                release_id:
                    type: string
                reported_at:
                    format: date-time
                    type: string
                state:
                    type: string
                version:
                    type: string
            required:
                - version
                - os
                - arch
                - state
                - reported_at
            type: object
        Empty:
            additionalProperties: false
            properties: {}
            required: []
            type: object
        EnrollmentChallengeRequest:
            additionalProperties: false
            properties:
                device_id:
                    type: string
                key:
                    type: string
                name:
                    type: string
                public_key:
                    format: byte
                    type: string
            required:
                - key
                - device_id
                - name
                - public_key
            type: object
        Error:
            $ref: '#/components/schemas/Result'
        FieldIssue:
            properties:
                field:
                    type: string
                rule:
                    type: string
            required:
                - field
                - rule
            type: object
        Freshness:
            properties:
                observed_at:
                    format: date-time
                    type: string
                snapshot_at:
                    format: date-time
                    type: string
            required:
                - observed_at
                - snapshot_at
            type: object
        Game:
            properties:
                background_url:
                    type: string
                cover_url:
                    type: string
                enabled:
                    type: boolean
                id:
                    type: string
                name:
                    type: string
                network:
                    $ref: '#/components/schemas/GameNetwork'
                ports:
                    items:
                        $ref: '#/components/schemas/GamePort'
                    type: array
                revision:
                    format: int64
                    type: integer
                source_url:
                    type: string
                summary:
                    type: string
            required:
                - id
                - name
                - summary
                - source_url
                - cover_url
                - background_url
                - ports
                - network
                - enabled
                - revision
            type: object
        GameImportRequest:
            properties:
                url:
                    type: string
            required:
                - url
            type: object
        GameNetwork:
            properties:
                broadcast:
                    type: boolean
                ethernet_types:
                    items:
                        format: int64
                        type: integer
                    type: array
                multicast:
                    type: boolean
                version:
                    format: int64
                    type: integer
            required:
                - version
                - broadcast
                - multicast
                - ethernet_types
            type: object
        GamePort:
            properties:
                description:
                    type: string
                port:
                    format: int64
                    type: integer
                port_end:
                    format: int64
                    type: integer
                protocol:
                    type: string
            required:
                - protocol
                - port
            type: object
        GameUpdateRequest:
            properties:
                enabled:
                    type: boolean
                name:
                    type: string
                network:
                    $ref: '#/components/schemas/GameNetwork'
                ports:
                    items:
                        $ref: '#/components/schemas/GamePort'
                    type: array
                revision:
                    format: int64
                    type: integer
            required:
                - name
                - ports
                - network
                - enabled
                - revision
            type: object
        HeartbeatRequest:
            properties:
                lan_version:
                    format: int64
                    type: integer
                mac:
                    type: string
            required:
                - lan_version
            type: object
        Invitation:
            properties:
                code:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                revision:
                    format: int64
                    type: integer
            required:
                - revision
                - code
                - expires_at
            type: object
        InviteInfo:
            properties:
                active:
                    type: boolean
                expires_at:
                    format: date-time
                    type: string
                revision:
                    format: int64
                    type: integer
            required:
                - active
                - revision
            type: object
        Issue:
            properties:
                code:
                    type: string
                occurred_at:
                    format: date-time
                    type: string
                resolved_at:
                    format: date-time
                    type: string
                scope:
                    type: string
            required:
                - scope
                - code
                - occurred_at
            type: object
        JoinRequest:
            additionalProperties: false
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        LANStatus:
            properties:
                interface:
                    type: string
                ipv6:
                    type: string
                mac:
                    type: string
                mtu:
                    format: int64
                    type: integer
                ready:
                    type: boolean
                version:
                    format: int64
                    type: integer
            required:
                - version
                - interface
                - mac
                - ipv6
                - mtu
                - ready
            type: object
        Lease:
            properties:
                ca:
                    type: string
                certificate:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                fingerprint:
                    type: string
                ip:
                    type: string
                network:
                    type: string
                node:
                    $ref: '#/components/schemas/Node'
                room_id:
                    type: string
            required:
                - ip
                - network
                - ca
                - certificate
                - fingerprint
                - expires_at
            type: object
        LeaseRequest:
            properties:
                public_key:
                    format: byte
                    type: string
                revision:
                    format: int64
                    type: integer
            required:
                - public_key
            type: object
        LinkSample:
            properties:
                country:
                    type: string
                device_id:
                    type: string
                ip:
                    type: string
                loss_percent:
                    format: double
                    type: number
                mode:
                    type: string
                probe_at:
                    format: date-time
                    type: string
                region:
                    type: string
                relay_ips:
                    items:
                        type: string
                    type: array
                remote:
                    type: string
                rtt_ms:
                    format: double
                    type: number
            required:
                - device_id
                - ip
                - mode
                - relay_ips
                - probe_at
            type: object
        LoginAttempt:
            properties:
                expires_at:
                    format: date-time
                    type: string
                id:
                    type: string
                url:
                    type: string
            required:
                - id
                - url
                - expires_at
            type: object
        LoginClaim:
            description: proof is the original private proof; sign UTF8(nodelane-login-claim:<id>:<proof>). A successful claim is consumed once. Never log proof or returned sessions.
            properties:
                id:
                    type: string
                proof:
                    type: string
                signature:
                    format: byte
                    type: string
            required:
                - id
                - proof
                - signature
            type: object
        LoginResult:
            properties:
                code:
                    type: string
                session:
                    $ref: '#/components/schemas/Session'
                state:
                    type: string
            required:
                - code
                - state
            type: object
        LoginStart:
            description: proof is SHA256 of a 64-hex-character random private proof. Sign UTF8(nodelane-login-start:<device_id>:<proof_hash>) with the device Ed25519 key. Only a valid device signature can start enrollment.
            properties:
                device_id:
                    type: string
                name:
                    type: string
                proof:
                    type: string
                public_key:
                    format: byte
                    type: string
                signature:
                    format: byte
                    type: string
            required:
                - signature
                - device_id
                - public_key
                - name
                - proof
            type: object
        Member:
            properties:
                device_id:
                    type: string
                ip:
                    type: string
                last_seen:
                    format: date-time
                    type: string
                mac:
                    type: string
                name:
                    type: string
                user_id:
                    type: string
            required:
                - user_id
                - device_id
                - name
                - ip
                - last_seen
            type: object
        MemberRequest:
            properties:
                device_id:
                    type: string
                expected_revision:
                    format: int64
                    type: integer
            required:
                - expected_revision
                - device_id
            type: object
        MembershipSelf:
            properties:
                device_id:
                    type: string
                reason:
                    type: string
                revision:
                    format: int64
                    type: integer
                room_id:
                    type: string
                state:
                    type: string
                valid_until:
                    format: date-time
                    type: string
            required:
                - state
                - revision
            type: object
        NetworkSample:
            properties:
                at:
                    format: date-time
                    type: string
                connections:
                    format: int64
                    type: integer
                epoch:
                    type: string
                generation:
                    format: int64
                    type: integer
                peers:
                    items:
                        $ref: '#/components/schemas/LinkSample'
                    type: array
                traffic:
                    $ref: '#/components/schemas/TrafficSample'
            required:
                - epoch
                - at
                - generation
                - connections
                - peers
            type: object
        NetworkState:
            properties:
                applied_game_revision:
                    format: int64
                    type: integer
                generation:
                    format: int64
                    type: integer
                reason:
                    type: string
                state:
                    type: string
            required:
                - state
                - generation
                - applied_game_revision
            type: object
        Node:
            properties:
                address:
                    type: string
                device_id:
                    type: string
                draining:
                    type: boolean
                generation:
                    format: int64
                    type: integer
                id:
                    type: string
                ip:
                    type: string
                last_seen:
                    format: date-time
                    type: string
                lighthouse:
                    type: boolean
                name:
                    type: string
                notes:
                    type: string
                region:
                    type: string
                relay:
                    type: boolean
                report:
                    $ref: '#/components/schemas/NodeReport'
                revision:
                    format: int64
                    type: integer
                state:
                    type: string
            required:
                - id
                - device_id
                - generation
                - revision
                - state
                - notes
                - report
                - name
                - region
                - ip
                - address
                - lighthouse
                - relay
                - draining
                - last_seen
            type: object
        NodeConfig:
            additionalProperties: false
            properties:
                address:
                    type: string
                lighthouse:
                    type: boolean
                name:
                    type: string
                notes:
                    type: string
                region:
                    type: string
                relay:
                    type: boolean
            required:
                - name
                - region
                - address
                - lighthouse
                - relay
                - notes
            type: object
        NodeOperation:
            properties:
                action:
                    type: string
                created_at:
                    format: date-time
                    type: string
                error:
                    type: string
                expires_at:
                    format: date-time
                    type: string
                generation:
                    format: int64
                    type: integer
                id:
                    type: string
                node_id:
                    type: string
                reason:
                    type: string
                revision:
                    format: int64
                    type: integer
                state:
                    type: string
            required:
                - id
                - node_id
                - generation
                - revision
                - action
                - state
                - created_at
                - expires_at
            type: object
        NodeProbe:
            properties:
                address:
                    type: string
                at:
                    format: date-time
                    type: string
                device_id:
                    type: string
                loss_percent:
                    format: double
                    type: number
                mode:
                    type: string
                remote:
                    type: string
                rtt_ms:
                    format: double
                    type: number
            required:
                - device_id
                - address
                - mode
                - at
            type: object
        NodeReport:
            properties:
                applied_config:
                    $ref: '#/components/schemas/NodeConfig'
                applied_revision:
                    format: int64
                    type: integer
                engine:
                    type: string
                error:
                    type: string
                last_renewal:
                    format: date-time
                    type: string
                lease_expires_at:
                    format: date-time
                    type: string
                probes:
                    items:
                        $ref: '#/components/schemas/NodeProbe'
                    type: array
                version:
                    type: string
            required:
                - version
                - engine
                - applied_revision
                - lease_expires_at
                - last_renewal
                - probes
            type: object
        NodeSync:
            properties:
                node:
                    $ref: '#/components/schemas/Node'
                operations:
                    items:
                        $ref: '#/components/schemas/NodeOperation'
                    type: array
                snapshot:
                    $ref: '#/components/schemas/Snapshot'
            required:
                - node
                - snapshot
                - operations
            type: object
        NodeSyncRequest:
            additionalProperties: false
            properties:
                generation:
                    format: int64
                    type: integer
                report:
                    $ref: '#/components/schemas/NodeReport'
                results:
                    items:
                        $ref: '#/components/schemas/OperationResult'
                    type: array
            required:
                - generation
                - report
                - results
            type: object
        OIDCSettings:
            properties:
                client_id:
                    type: string
                client_secret:
                    type: string
                    writeOnly: true
                enabled:
                    type: boolean
                issuer:
                    type: string
                revision:
                    format: int64
                    type: integer
            required:
                - revision
                - issuer
                - client_id
                - enabled
            type: object
        OK:
            additionalProperties: false
            properties:
                ok:
                    type: boolean
            required:
                - ok
            type: object
        Operation:
            properties:
                action:
                    type: string
                deadline:
                    format: date-time
                    type: string
                id:
                    type: string
                known_commit:
                    type: boolean
                result:
                    $ref: '#/components/schemas/Result'
                state:
                    type: string
            required:
                - id
                - state
                - deadline
                - known_commit
            type: object
        OperationResult:
            properties:
                error:
                    type: string
                id:
                    type: string
                state:
                    type: string
            required:
                - id
                - state
            type: object
        Peer:
            properties:
                device_id:
                    type: string
                error:
                    type: string
                ip:
                    type: string
                loss_percent:
                    format: double
                    type: number
                measured_at:
                    format: date-time
                    type: string
                mode:
                    type: string
                name:
                    type: string
                rtt_ms:
                    format: double
                    type: number
            required:
                - device_id
                - name
                - ip
                - mode
            type: object
        Permissions:
            properties:
                join:
                    type: boolean
                leave:
                    type: boolean
                manage:
                    type: boolean
            required:
                - manage
                - join
                - leave
            type: object
        Result:
            properties:
                cause_request_id:
                    type: string
                code:
                    enum:
                        - account_deleted
                        - account_device_limit
                        - account_disabled
                        - account_guest_logout_forbidden
                        - account_identity_conflict
                        - account_in_use
                        - account_link_not_allowed
                        - admin_credentials_invalid
                        - admin_current_password_invalid
                        - admin_password_changed
                        - admin_session_required
                        - admin_user_deleted
                        - api_contract_unsupported
                        - auth_challenge_unusable
                        - auth_device_expired
                        - auth_device_revoked
                        - auth_device_unregistered
                        - auth_identity_scope_conflict
                        - auth_login_cancelled
                        - auth_login_config_changed
                        - auth_login_confirmation_required
                        - auth_login_denied
                        - auth_login_expired
                        - auth_login_pending
                        - auth_login_provider_unavailable
                        - auth_login_unusable
                        - auth_login_validation_failed
                        - auth_oidc_unavailable
                        - auth_proof_invalid
                        - auth_session_required
                        - client_update_required
