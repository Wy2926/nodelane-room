                - in: header
                  name: Origin
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            oneOf:
                                - additionalProperties: false
                                  properties:
                                    ca_cert:
                                        type: string
                                    ca_key:
                                        format: password
                                        type: string
                                        writeOnly: true
                                    ca_mode:
                                        enum:
                                            - generate
                                            - upload
                                        type: string
                                    code:
                                        maxLength: 64
                                        minLength: 64
                                        type: string
                                        writeOnly: true
                                    database_url:
                                        format: password
                                        type: string
                                        writeOnly: true
                                    mode:
                                        enum:
                                            - create
                                        type: string
                                    network:
                                        default: 10.203.0.0/16
                                        type: string
                                    password:
                                        description: 12–128 UTF-8 bytes, not characters
                                        format: password
                                        type: string
                                    public_url:
                                        description: HTTPS origin or bare domain, must match the browser origin for creation
                                        type: string
                                    registry:
                                        default: docker.nodelane.net
                                        type: string
                                    username:
                                        type: string
                                  required:
                                    - mode
                                    - code
                                    - username
                                    - password
                                    - database_url
                                    - public_url
                                    - ca_mode
                                  type: object
                                - additionalProperties: false
                                  properties:
                                    code:
                                        maxLength: 64
                                        minLength: 64
                                        type: string
                                        writeOnly: true
                                    database_url:
                                        format: password
                                        type: string
                                        writeOnly: true
                                    mode:
                                        enum:
                                            - connect
                                        type: string
                                    password:
                                        description: 12–128 UTF-8 bytes, not characters
                                        format: password
                                        type: string
                                    username:
                                        type: string
                                  required:
                                    - mode
                                    - code
                                    - username
                                    - password
                                    - database_url
