                        - local_no_room
                        - local_peer_unreachable
                        - local_permission_denied
                        - local_platform_unsupported
                        - local_policy_invalid
                        - local_preference_save_failed
                        - local_probe_target_ambiguous
                        - local_probe_target_unavailable
                        - local_probe_unavailable
