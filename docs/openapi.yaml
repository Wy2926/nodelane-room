x-local-api:
    images:
        description: Public JPEG/PNG fetched only from the configured control origin, without session or redirects; at most two concurrent downloads; never part of status.
        kind:
            - cover
            - background
        max_response_bytes: 5242880
        method: GET
        path: /game-images/{game}/{kind}
    protocol_version: 3
    rpc:
        description: Protocol 3. Mutations require stable command_id; the protected service ledger freezes the raw request and deadline before submission. Recover through get-operation and status.pending_operations. No legacy protocol support. Peer rtt_ms and loss_percent summarize completed background probes from the last 30 seconds; measured_at is the latest completed probe time. RTT averages successful replies only; all timeouts yield 100 percent loss without RTT, and no recent samples omit both values.
        error:
            $ref: '#/components/schemas/Result'
        max_request_bytes: 65536
        max_response_bytes: 4194304
        method: POST
        path: /rpc
        request:
            additionalProperties: false
            properties:
                action:
                    enum:
                        - init
                        - account-login
                        - account-link
                        - account-poll
                        - account-cancel
                        - account-logout
                        - account-takeover
                        - update-status
                        - update-check
                        - update-install
                        - status
                        - games
                        - rooms
                        - manage
                        - members
                        - create
                        - join
                        - invite
                        - kick
                        - transfer
                        - leave
                        - close
                        - ping
                        - doctor
                        - capabilities
                        - get-operation
                        - network-retry
                        - network-stop
                        - invite-info
                        - invite-revoke
                        - owner-join
                        - account-devices
                        - account-status
                        - revoke-device
                    type: string
                body:
                    type: object
                command_id:
                    maxLength: 128
                    minLength: 16
                    type: string
                contract:
                    enum:
                        - interaction-1
                    type: string
                name:
                    type: string
                room:
                    type: string
                server:
                    type: string
                target:
                    type: string
            required:
                - contract
                - action
            type: object
        response:
            $ref: '#/components/schemas/Result'
        responses:
            games:
                items:
                    $ref: '#/components/schemas/Game'
                type: array
            get-operation:
                $ref: '#/components/schemas/Operation'
            manage:
                $ref: '#/components/schemas/RoomManagement'
            members:
                $ref: '#/components/schemas/Snapshot'
            rooms:
                $ref: '#/components/schemas/RoomPage'
            status:
                $ref: '#/components/schemas/Status'
            update-check:
                $ref: '#/components/schemas/UpdateStatus'
            update-install:
                additionalProperties: false
                properties:
                    elevate:
                        type: boolean
                required:
                    - elevate
                type: object
            update-status:
                $ref: '#/components/schemas/UpdateStatus'
    transport: HTTP over owner-authorized Named Pipe (Windows) or Unix socket (Linux); not served on the public control listener
