    securitySchemes:
        AdminCookie:
            description: 12 hour random session; 30 minute idle timeout. Secure, HttpOnly, SameSite=Strict. All admin writes also require exact Origin and X-CSRF-Token.
            in: cookie
            name: __Host-nlroom-admin
            type: apiKey
        Bearer:
            description: One-hour device session from challenge verification
            scheme: bearer
            type: http
        NodeBearer:
            description: One-hour session scoped to the current nonrevoked node identity binding. Cannot authorize player/admin APIs.
            scheme: bearer
            type: http
info:
    description: 'Fresh database schema version 6 and identities required; API remains /v2. No old data migration. Device Ed25519 proofs sign UTF-8 nodelane-auth-v2:<scope>:<challenge-id>: followed by raw challenge nonce; scope is guest, player, node, or enrollment. Device identity and Nebula X25519 keys are separate. Byte fields use standard base64. Temporary enrollment keys contain 32 random bytes encoded as 64 hex characters, expire after 30 minutes and are consumed transactionally once. Never log credentials.'
    title: NodeLane Room V2
    version: 0.3.0
openapi: 3.0.3
paths:
    /healthz:
        get:
            operationId: health
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
                "503":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
            security: []
            summary: Process liveness
            tags:
                - Operations
    /install/{file}:
        get:
            parameters:
                - in: path
                  name: file
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        '*/*':
                            schema:
                                format: binary
                                type: string
                        application/json:
                            schema:
                                additionalProperties: true
                                type: object
                        text/*:
                            schema:
                                type: string
                    description: Raw file bytes; Content-Type depends on the selected file. manifest.json is a JSON object, scripts/checksums are text, and archives are gzip data.
                "404":
                    description: Unknown or unavailable release file
            security: []
            summary: Read-only node.sh, manifest.json, SHA256SUMS or exact-version native archive
            tags:
                - Operations
    /metrics:
        get:
            operationId: metrics
            responses:
                "200":
                    content:
                        text/plain:
                            schema:
                                type: string
                    description: Counters and gauges
            security: []
            summary: Prometheus metrics; restrict to monitoring network
            tags:
                - Operations
    /readyz:
        get:
            operationId: ready
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
                "503":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    status:
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Success
            security: []
            summary: Database and CA readiness
            tags:
                - Operations
    /v2/admin/events:
        get:
            description: Each event is named snapshot, with AdminSnapshot JSON data and its durable revision as id. Last-Event-ID is accepted; old, pruned or future cursors recover via the complete current snapshot. Does not replay secrets. Session validity checked on each event.
            parameters:
                - in: header
                  name: Last-Event-ID
                  schema:
                    type: string
                - in: header
                  name: X-NodeLane-Contract
                  required: true
                  schema:
                    enum:
                        - interaction-1
                    type: string
            responses:
                "200":
                    content:
                        text/event-stream:
                            schema:
                                type: string
                    description: SSE snapshot stream
                "400":
                    $ref: '#/components/responses/Error'
                "401":
                    $ref: '#/components/responses/Error'
                "403":
                    $ref: '#/components/responses/Error'
                "404":
                    $ref: '#/components/responses/Error'
                "405":
                    $ref: '#/components/responses/Error'
                "409":
                    $ref: '#/components/responses/Error'
                "410":
                    $ref: '#/components/responses/Error'
                "413":
                    $ref: '#/components/responses/Error'
                "415":
                    $ref: '#/components/responses/Error'
                "422":
                    $ref: '#/components/responses/Error'
                "429":
                    $ref: '#/components/responses/Error'
                "500":
                    $ref: '#/components/responses/Error'
                "503":
                    $ref: '#/components/responses/Error'
                "504":
                    $ref: '#/components/responses/Error'
            security:
                - AdminCookie: []
            summary: SSE full authoritative snapshots with durable event IDs; reconnect every five minutes
            tags:
                - Admin
            x-events:
                reset:
                    $ref: '#/components/schemas/Result'
                snapshot: Current authoritative snapshot; former room members receive only self tombstones
                terminal:
                    $ref: '#/components/schemas/Result'
    /v2/admin/games/{game}:
        put:
            description: TCP/UDP port intervals cover 1–65535 with no port-count limit; overlapping intervals are rejected. network.version=1 is required for all games, including custom; Ethernet LAN with broadcast/multicast and explicit extra non-IP EtherTypes (0 for IEEE 802.3/LLC). Enabled games require ports or non-IP rules. Policy, revision and room/admin events update transactionally in database schema 6; no schema migration. Disabling withdraws game authorization.
            parameters:
                - in: path
                  name: game
                  required: true
                  schema:
                    type: string
                - in: header
                  name: Origin
                  required: true
                  schema:
                    type: string
                - in: header
                  name: X-CSRF-Token
                  required: true
                  schema:
                    maxLength: 64
                    minLength: 64
                    type: string
                - in: header
                  name: Idempotency-Key
                  required: true
                  schema:
                    maxLength: 128
                    minLength: 16
                    type: string
                - in: header
                  name: X-NodeLane-Contract
                  required: true
                  schema:
                    enum:
                        - interaction-1
                    type: string
                - description: Immutable deadline, future and at most database time + 1 hour on first acceptance. Binds raw body, method and path to Idempotency-Key. Expired requests cannot execute.
                  in: header
                  name: X-NodeLane-Operation-Deadline
                  required: true
                  schema:
                    format: date-time
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GameUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/Result'
                                    - properties:
                                        data:
                                            $ref: '#/components/schemas/Game'
                                      type: object
                                x-interaction-envelope: true
                    description: Success
                "400":
                    $ref: '#/components/responses/Error'
                "401":
                    $ref: '#/components/responses/Error'
                "403":
                    $ref: '#/components/responses/Error'
                "404":
                    $ref: '#/components/responses/Error'
                "405":
                    $ref: '#/components/responses/Error'
                "409":
                    $ref: '#/components/responses/Error'
                "410":
                    $ref: '#/components/responses/Error'
                "413":
                    $ref: '#/components/responses/Error'
                "415":
                    $ref: '#/components/responses/Error'
                "422":
                    $ref: '#/components/responses/Error'
                "429":
                    $ref: '#/components/responses/Error'
                "500":
                    $ref: '#/components/responses/Error'
                "503":
                    $ref: '#/components/responses/Error'
                "504":
                    $ref: '#/components/responses/Error'
            security:
                - AdminCookie: []
            summary: Update name, TCP/UDP port intervals, Ethernet LAN policy and enabled state using the original revision
            tags:
                - Admin
    /v2/admin/games/import:
        post:
            description: Only https://store.steampowered.com/app/<id>/ links; fixed store API and HTTPS steamstatic.com artwork, public resolved addresses, bounded redirects/downloads. No API key. 10 imports/admin/minute, at most 500 games. External failure stores nothing; a completed retry returns its cached response. Steam Store appdetails availability and fields may change. Ports are configured manually after import.
            parameters:
                - in: header
                  name: Origin
                  required: true
                  schema:
                    type: string
                - in: header
                  name: X-CSRF-Token
                  required: true
                  schema:
                    maxLength: 64
                    minLength: 64
                    type: string
                - in: header
                  name: Idempotency-Key
                  required: true
                  schema:
                    maxLength: 128
                    minLength: 16
                    type: string
                - in: header
                  name: X-NodeLane-Contract
                  required: true
                  schema:
                    enum:
                        - interaction-1
                    type: string
                - description: Immutable deadline, future and at most database time + 1 hour on first acceptance. Binds raw body, method and path to Idempotency-Key. Expired requests cannot execute.
                  in: header
                  name: X-NodeLane-Operation-Deadline
                  required: true
                  schema:
                    format: date-time
