[package]
name = "nlroom"
version = "0.2.1"
edition = "2021"
rust-version = "1.95"
description = "NodeLane Room desktop client"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-notification = "=2.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.5"
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[features]
custom-protocol = ["tauri/custom-protocol"]
